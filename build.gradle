plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'external-data-service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // para los test de jUnit
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Tests de integracion (2026-10-18): un MySQL y un Redis de verdad en
    // contenedores. Las versiones las fija el BOM de Spring Boot. Kafka NO va:
    // este servicio solo produce eventos (no hay ningun @KafkaListener), asi
    // que el contexto arranca sin broker, y en los tests el productor se
    // sustituye por un doble.
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
    // Cliente HTTP de los tests. Sin esto, TestRestTemplate usa
    // HttpURLConnection del JDK, que no puede reintentar un POST tras un 401 y
    // se queda colgado. Con Apache HttpClient en el classpath, Spring Boot lo
    // elige solo. La version la fija el BOM.
    testImplementation 'org.apache.httpcomponents.client5:httpclient5'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.springframework.security:spring-security-test'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'


    //runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.mysql:mysql-connector-j'
    // Añade esta línea:
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // Kafka
    implementation 'org.springframework.kafka:spring-kafka'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}